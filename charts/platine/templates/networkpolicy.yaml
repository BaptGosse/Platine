{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platine.fullname" . }}
  labels:
    {{- include "platine.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platine.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.ingress.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # DNS resolution (dns: null allows any destination).
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      {{- with .Values.networkPolicy.egress.dns }}
      to:
        - {{ toYaml . | nindent 10 | trim }}
      {{- end }}
    # Public Internet only (private ranges excluded).
    - to:
        {{- range .Values.networkPolicy.egress.ipBlocks }}
        - ipBlock:
            cidr: {{ .cidr }}
            {{- with .except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

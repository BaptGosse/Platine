apiVersion: v1
kind: Pod
metadata:
  name: {{ include "platine.fullname" . }}-test-connection
  labels:
    {{- include "platine.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    # Reuse the app image (already on the node) instead of pulling another one.
    - name: healthz
      image: {{ include "platine.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command:
        - python
        - -c
        - |
          import urllib.request
          url = "http://{{ include "platine.fullname" . }}:{{ .Values.service.port }}/healthz"
          with urllib.request.urlopen(url, timeout=10) as res:
              assert res.status == 200, res.status
              print(url, "->", res.status)
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

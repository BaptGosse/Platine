{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- if not .Values.auth.password }}
{{- fail "auth.enabled=true: set auth.password or auth.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platine.authSecretName" . }}
  labels:
    {{- include "platine.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.usernameKey }}: {{ .Values.auth.username | b64enc | quote }}
  {{ .Values.auth.passwordKey }}: {{ .Values.auth.password | b64enc | quote }}
{{- end }}

[project]
name = "platine"
version = "2.0.0"
description = "Platine: paste a link, get a 320 kbps MP3. YouTube, YouTube Music, SoundCloud, Spotify and hundreds of other sites."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # yt-dlp moves fast (YouTube keeps breaking things): `make update-ytdlp` updates it.
    # The "deno" extra provides the JavaScript runtime yt-dlp now needs for YouTube.
    "yt-dlp[default,deno]>=2026.8.19",
    "fastapi>=0.152",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.11",
    "prometheus-fastapi-instrumentator>=8.1",
    # Spotify: metadata without an API key, then the same track is looked up on YouTube Music.
    "spotifyscraper>=3.9",
    "ytmusicapi>=1.12",
    "typer>=0.27",
    "rich>=15",
]

[project.scripts]
platine = "platine.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "httpx2>=2.15",
    "responses>=0.26",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-requests>=2.33",
    "uv>=0.13",
    "genbadge[coverage]>=1.1.3",
    "lcov-cobertura>=2.1.1",
    "pylint>=4",
    "pylint-per-file-ignores>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platine"]

[tool.uv]
# The uv binary itself comes from the ghcr.io/astral-sh/uv image (Dockerfile) or from `pip install uv`.
required-version = ">=0.13"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "PTH", "RUF", "S", "ASYNC"]
# French typography in the translations: thin spaces, typographic apostrophes...
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
files = ["platine", "scripts"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["yt_dlp.*", "ytmusicapi.*", "mutagen.*"]
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.12"
jobs = 0
load-plugins = ["pylint_per_file_ignores"]

[tool.pylint.format]
max-line-length = 120  # same as ruff

[tool.pylint.design]
max-args = 6
max-attributes = 12  # dataclasses and API models describe data, not behavior

[tool.pylint."messages control"]
# pytest idioms: fixtures are injected as arguments with the fixture's name, fakes mirror
# signatures they do not use, and test names say what docstrings would.
per-file-ignores = [
    "tests/*:missing-module-docstring,missing-class-docstring,missing-function-docstring,redefined-outer-name,unused-argument,too-few-public-methods,protected-access",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not network"]
markers = ["network: really downloads from the Internet (make test-network)"]

[tool.coverage.run]
source = ["platine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

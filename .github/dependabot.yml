# Platine depends on yt-dlp, which ships fixes often to keep up with sites:
# Dependabot proposes the upgrade every week.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      yt-dlp:
        patterns: ["yt-dlp*"]
      python:
        patterns: ["*"]
        exclude-patterns: ["yt-dlp*"]
  # Actions are pinned to a commit SHA, with the version in a comment that Dependabot keeps
  # up to date. One pull request for all of them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

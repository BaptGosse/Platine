name: Platine CI

# Every push on main that passes CI is released: image, Helm chart, tag and GitHub release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # On main, runs queue up instead: a release is never cut in half.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Same Python as the image (Dockerfile).
  PYTHON_VERSION: "3.15"
  UV_VERSION: "0.13.4"
  TRIVY_VERSION: v0.76.0
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.7.0
  KUBERNETES_VERSION: "1.33.0"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      minor: ${{ steps.next.outputs.minor }}
      release: ${{ steps.next.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Patches are automatic: last tag + 1. For a new minor or major, raise the version in
      # pyproject.toml (`make version VERSION=2.1.0`): it becomes the next release.
      - name: Next version
        id: next
        env:
          ON_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          base=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          last=${last#v}
          current=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n 1)
          release=$ON_MAIN
          if [ -n "$current" ]; then
            # This commit is already released (run started again by hand).
            version=${current#v}
            release=false
          elif [ -z "$last" ] || [ "$(printf '%s\n' "$base" "$last" | sort -V | tail -n 1)" != "$last" ]; then
            version=$base
          else
            IFS=. read -r major minor patch <<<"$last"
            version="$major.$minor.$((patch + 1))"
          fi
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "### Platine $version (release: $release)" >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python (ruff, mypy, pylint, tests, coverage)
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pylint
        run: uv run pylint platine tests scripts
      - name: Tests with coverage
        run: >-
          uv run pytest --cov --cov-report=term
          --cov-report=xml:coverage/python/coverage.xml
          --cov-report=html:coverage/python/html
          --cov-report=lcov:coverage/python/lcov.info
      - name: Coverage gate (100 %)
        if: ${{ !cancelled() }}
        run: uv run python scripts/coverage_gate.py --name Python coverage/python/lcov.info
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: coverage/python
          if-no-files-found: error
      - name: Upload to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage/python/coverage.xml
          flags: python

  js:
    name: JavaScript (tests, coverage)
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Tests with coverage
        run: deno test --coverage=coverage/js/raw tests/js
      - name: Coverage reports (lcov, HTML)
        if: ${{ !cancelled() }}
        # Same filter as `make coverage-js`: main.js (bootstrap) and sw.js (service worker) are left out.
        run: |
          filter=(--include='platine/static/js/' --exclude='main\.js')
          deno coverage coverage/js/raw "${filter[@]}" --lcov --output=coverage/js/lcov.info
          # deno test already wrote an unfiltered HTML report there: start from a clean directory.
          rm -rf coverage/js/raw/html
          deno coverage coverage/js/raw "${filter[@]}" --html
          mv coverage/js/raw/html coverage/js/html
      - name: Coverage gate (100 %)
        if: ${{ !cancelled() }}
        run: python3 scripts/coverage_gate.py --name JS coverage/js/lcov.info
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-js
          path: |
            coverage/js
            !coverage/js/raw
          if-no-files-found: error
      - name: Upload to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage/js/lcov.info
          flags: js

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Helm lint
        run: |
          helm lint charts/platine
          helm lint charts/platine --values charts/platine/ci/all-features-values.yaml
      - name: Kubeconform
        run: |
          for values in charts/platine/values.yaml charts/platine/ci/all-features-values.yaml; do
            echo "::group::$values"
            helm template platine charts/platine --values "$values" \
              | docker run --rm -i "$KUBECONFORM_IMAGE" -strict -summary \
                  -kubernetes-version "$KUBERNETES_VERSION" \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

  security:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      # Settings in trivy.yaml: dependencies (uv.lock), secrets, Dockerfile and Helm chart.
      - name: Full report for the Security tab
        run: >-
          trivy fs --config trivy.yaml --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          --ignore-unfixed=false --exit-code 0 --format sarif --output trivy-fs.sarif .
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        # Pull requests from forks get a read-only token, which cannot upload.
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Gate (HIGH and CRITICAL with a fix available)
        run: trivy fs --config trivy.yaml .

  coverage-pages:
    name: Publish coverage to GitHub Pages
    # Published even when a gate fails, so the badges always show the real numbers.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [python, js]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install badge tools
        run: uv sync --frozen --only-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-python
          path: site/python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-js
          path: site/js
      - name: Badges
        run: |
          mkdir -p site/badges
          uv run --no-sync genbadge coverage -l -n "python coverage" -i site/python/coverage.xml -o site/badges/python.svg
          uv run --no-sync lcov_cobertura site/js/lcov.info -b . -o site/js/cobertura.xml
          uv run --no-sync genbadge coverage -l -n "js coverage" -i site/js/cobertura.xml -o site/badges/js.svg
      - name: Index page
        run: |
          cp platine/static/brand/logo-white.svg platine/static/brand/mark.svg site/
          sed -e "s|{{REPO_URL}}|$GITHUB_SERVER_URL/$GITHUB_REPOSITORY|g" \
              -e "s|{{COMMIT_SHORT}}|${GITHUB_SHA::7}|g" \
              -e "s|{{COMMIT}}|$GITHUB_SHA|g" \
              -e "s|{{DATE}}|$(date -u '+%Y-%m-%d %H:%M UTC')|g" \
              .github/coverage-site/index.html > site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  image:
    name: Container image (build, Trivy scan, push)
    needs: [version, python, js, helm, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }},priority=1000
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ needs.version.outputs.release == 'true' }}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      # Built and scanned first: an image with a fixable HIGH or CRITICAL issue is never pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: platine:scan
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      # Fixable issues of every severity. Debian CVEs without a fix stay out of the tab: nothing to do
      # about them until Debian ships one, which `apt-get upgrade` then picks up at the next build.
      - name: Report for the Security tab
        run: >-
          trivy image --config trivy.yaml --scanners vuln,secret --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          --exit-code 0 --format sarif --output trivy-image.sarif platine:scan
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Gate (HIGH and CRITICAL with a fix available)
        run: trivy image --config trivy.yaml --scanners vuln,secret platine:scan
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same build again, straight from the builder cache, this time pushed with its tags.
      - name: Push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  chart:
    name: Publish Helm chart
    if: needs.version.outputs.release == 'true'
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Helm package and push to oci://ghcr.io/<owner>/charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # The chart takes the release version, and defaults to the image pushed just before.
          helm package charts/platine --version "$VERSION" --app-version "$VERSION" --destination dist
          helm push "dist/platine-$VERSION.tgz" "oci://ghcr.io/$owner/charts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-chart
          path: dist
          if-no-files-found: error

  release:
    name: GitHub release
    if: needs.version.outputs.release == 'true'
    needs: [version, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Like semantic-release: when a newer commit reached main during this run, the run of that commit
      # releases this version with everything in it. GitHub would refuse anyway to tag this commit
      # with GITHUB_TOKEN if the newer one changed a workflow.
      - name: Still the latest commit on main
        id: latest
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main moved on to ${head::7}: its run releases v$VERSION."
          fi
      - if: steps.latest.outputs.latest == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-chart
          path: dist
      - if: steps.latest.outputs.latest == 'true'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - if: steps.latest.outputs.latest == 'true'
        name: SBOM of the published image (CycloneDX)
        run: >-
          trivy image --format cyclonedx --output "dist/platine-$VERSION.sbom.cdx.json"
          "ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
      - if: steps.latest.outputs.latest == 'true'
        name: Release notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "${previous:+$previous..}HEAD"
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "podman run --rm -p 8320:8320 ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
            echo "helm install platine oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/platine --version $VERSION"
            echo '```'
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...v$VERSION"
            fi
          } > notes.md
      # Creates the vX.Y.Z tag on this commit. Tags made with GITHUB_TOKEN start no new run.
      - if: steps.latest.outputs.latest == 'true'
        name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "v$VERSION" dist/*
          --target "$GITHUB_SHA" --title "Platine $VERSION" --notes-file notes.md
